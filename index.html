<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Razor — Loja de Camisas</title>
  <link rel="stylesheet" href="style.css">
  <link rel="shortcut icon" href="./Fotos/Logo.png" type="image/x-icon">
</head>
<body>

<div class="top-bar">LANÇAMENTOS DA TEMPORADA 2026 ⚽</div>

<header>
  <div class="header-top">
    <div class="logo">RAZOR</div>
    <div class="search"><input type="text" placeholder="O que você está buscando?"></div>
    <div class="user-cart">🛒 R$ 00,00</div>
  </div>
  <nav>
    <a href="#">Início</a>
    <a href="#">Camisas Retrô</a>
    <a href="#">Camisas Novas</a>
    <a href="./Brasil.html">Seleção Brasileira</a>
  </nav>
</header>

<section class="hero">
  <div class="hero-text">
    <h1>AQUI É BRASIL!!!</h1>
    <p>Confira a coleção de camisas da nossa seleção</p>
    <button class="glow-on-hover">Veja mais</button>
  </div>
  <img class="hero-img" src="./Fotos/Brasil card grande.jpg">
</section>

<section class="section">
  <h2>Queridinhas</h2>

  <div class="carousel-wrapper">
    <button class="carousel-btn prev" onclick="scrollCarousel(-1)">‹</button>

    <div class="products carousel" id="products"></div>

    <button class="carousel-btn next" onclick="scrollCarousel(1)">›</button>
  </div>
</section>


<section class="banners">
  <div class="banner"><img src="./Fotos/Card Futebol Brasileiro.webp"></div>
  <div class="banner"><img src="./Fotos/Card retro.webp"></div>
</section>

<footer>
  <div>Meios de pagamento: Visa | Master | Pix | Elo</div>
  <div class="footer-bottom">© 2026 Razor — Todos os direitos reservados.</div>
</footer>

<script src="script.js"></script>
</body>
</html>
